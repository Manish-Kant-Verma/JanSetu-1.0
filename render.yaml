# Render blueprint for JanSetu (single web service: Express API + built React client).
#
# Deploy: push this folder to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repository.
#
# Notes:
#   - The "disk" below needs a paid instance type. On the free instance type
#     remove the disk and the JANSETU_DATA_DIR variable: the app still works,
#     but the JSON database and uploaded evidence are reset on every deploy.
#   - NOMINATIM_REVERSE_URL is intentionally NOT set here. Only add it after
#     reading and accepting https://operations.osmfoundation.org/policies/nominatim/
#     (see GEOCODING.md).
services:
  - type: web
    name: jansetu
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm run deploy:prepare
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JANSETU_DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: GEOCODING_USER_AGENT
        value: JanSetu/1.0 (civic complaint address lookup)
    disk:
      name: jansetu-data
      mountPath: /var/data
      sizeGB: 1