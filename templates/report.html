
{% extends "base.html" %}{% block title %}Report — JanSetu{% endblock %}
{% block content %}<div class="form-wrap wide"><p class="eyebrow">NEW CIVIC CASE</p><h1>Report a local problem.</h1><p class="muted">Your case will enter community verification. Add strong evidence so other citizens can independently confirm it.</p>
<form method="post" enctype="multipart/form-data" class="form card"><label>Problem title<input name="title" required placeholder="e.g. Large pothole near primary school"></label><label>Category<select name="category" required>{% for x in ['Roads','Water','Sanitation','Streetlights','Drainage','Electricity','Waste','Public Safety','Other'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="6" required placeholder="What is happening, how long, who is affected?"></textarea></label><label>Locality<input name="locality" value="{{user.locality}}" required></label><label>Address / landmark<input name="address" placeholder="Nearest landmark"></label><div class="two"><label>Latitude<input name="latitude" id="lat"></label><label>Longitude<input name="longitude" id="lon"></label></div><button type="button" class="btn ghost" onclick="locate()">Use my location</button><label>Photos (JPG/PNG/WEBP, max 8MB)<input type="file" name="images" accept="image/*" multiple required></label><button class="btn">Submit for community verification</button></form></div>
<script>function locate(){navigator.geolocation?.getCurrentPosition(p=>{lat.value=p.coords.latitude;lon.value=p.coords.longitude},()=>alert('Location permission was not granted.'))}</script>{% endblock %}
